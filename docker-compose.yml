services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./front/MedLoc
      dockerfile: Dockerfile
      target: dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    volumes:
      - ./front/MedLoc:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  frontend-prod:
    profiles:
      - prod
    build:
      context: ./front/MedLoc
      dockerfile: Dockerfile
      target: prod
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
